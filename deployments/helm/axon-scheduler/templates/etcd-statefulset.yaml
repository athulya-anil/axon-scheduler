{{- if .Values.etcd.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: axon-etcd
  namespace: {{ .Values.namespace }}
  labels:
    app: axon-etcd
    {{- include "axon-scheduler.labels" . | nindent 4 }}
spec:
  clusterIP: None
  ports:
  - port: 2379
    name: client
  - port: 2380
    name: peer
  selector:
    app: axon-etcd
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: axon-etcd
  namespace: {{ .Values.namespace }}
  labels:
    app: axon-etcd
    {{- include "axon-scheduler.labels" . | nindent 4 }}
spec:
  serviceName: axon-etcd
  replicas: {{ .Values.etcd.replicaCount }}
  selector:
    matchLabels:
      app: axon-etcd
  template:
    metadata:
      labels:
        app: axon-etcd
    spec:
      containers:
      - name: etcd
        image: "{{ .Values.etcd.image.repository }}:{{ .Values.etcd.image.tag }}"
        imagePullPolicy: {{ .Values.etcd.image.pullPolicy }}
        ports:
        - containerPort: 2379
          name: client
        - containerPort: 2380
          name: peer
        env:
        - name: ETCD_NAME
          valueFrom:
            fieldRef:
              fieldPath: metadata.name
        - name: ETCD_INITIAL_CLUSTER
          value: "axon-etcd-0=http://axon-etcd-0.axon-etcd:2380,axon-etcd-1=http://axon-etcd-1.axon-etcd:2380,axon-etcd-2=http://axon-etcd-2.axon-etcd:2380"
        - name: ETCD_INITIAL_CLUSTER_STATE
          value: "new"
        - name: ETCD_INITIAL_CLUSTER_TOKEN
          value: "axon-etcd-cluster"
        - name: ETCD_ADVERTISE_CLIENT_URLS
          value: "http://$(ETCD_NAME).axon-etcd:2379"
        - name: ETCD_LISTEN_CLIENT_URLS
          value: "http://0.0.0.0:2379"
        - name: ETCD_INITIAL_ADVERTISE_PEER_URLS
          value: "http://$(ETCD_NAME).axon-etcd:2380"
        - name: ETCD_LISTEN_PEER_URLS
          value: "http://0.0.0.0:2380"
        - name: ETCD_DATA_DIR
          value: "/var/lib/etcd"
        volumeMounts:
        - name: etcd-data
          mountPath: /var/lib/etcd
        resources:
          {{- toYaml .Values.etcd.resources | nindent 10 }}
        livenessProbe:
          httpGet:
            path: /health
            port: 2379
          initialDelaySeconds: 10
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /health
            port: 2379
          initialDelaySeconds: 5
          periodSeconds: 5
  {{- if .Values.etcd.persistence.enabled }}
  volumeClaimTemplates:
  - metadata:
      name: etcd-data
    spec:
      accessModes: [ "ReadWriteOnce" ]
      {{- if .Values.etcd.persistence.storageClass }}
      storageClassName: {{ .Values.etcd.persistence.storageClass }}
      {{- end }}
      resources:
        requests:
          storage: {{ .Values.etcd.persistence.size }}
  {{- end }}
{{- end }}
